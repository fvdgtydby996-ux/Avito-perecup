name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          f=$(find . -name '*.html' -not -path './node_modules/*' -not -path './www/*' | head -n 1)
          echo "Found: $f"
          cp "$f" www/index.html

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate app icon
        run: |
          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon-only.png
            cp icon.png assets/icon-foreground.png
            python3 - <<'PY'
          import zlib, struct
          w = h = 1024
          raw = (b'\x00' + bytes([2, 0, 26]) * w) * h
          def ch(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + ch(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)) + ch(b'IDAT', zlib.compress(raw)) + ch(b'IEND', b'')
          open('assets/icon-background.png', 'wb').write(png)
          PY
            npm install --no-save @capacitor/assets
            npx capacitor-assets generate --android
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk avito-perekup.apk

      - name: Upload APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: avito-perekup-apk
          path: avito-perekup.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: avito-perekup.apk
